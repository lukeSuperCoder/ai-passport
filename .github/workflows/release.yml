# 按 ota/channel（与 git 分支一致）发对应固件。
# 标签形如 demo-tamagotchi-v0.2.0，只回写 ota/<channel>/latest.json。
# 发两份：*.bin 是 OTA 应用分区（设备更新只拉这份）；*-factory.bin 是 0x0 整片。
# latest.json 的 url/sha256/size 永远指向应用分区，不要把工厂包写进 url。
# 不要每个提交都发版。
name: Release firmware

on:
  push:
    tags:
      - "*-v*.*.*"
      - "v*.*.*"
  workflow_dispatch:
    inputs:
      version:
        description: "Semver without v, e.g. 0.2.0"
        required: true
        type: string

permissions:
  contents: write

jobs:
  release:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 0

      - name: Resolve channel and version
        id: ver
        run: |
          set -euo pipefail
          CHANNEL=$(grep -v '^#' ota/channel | head -1 | tr -d '[:space:]')
          if [ -z "$CHANNEL" ]; then
            echo "ota/channel is empty" >&2
            exit 1
          fi
          SLUG="${CHANNEL//\//-}"
          if [ "${GITHUB_EVENT_NAME}" = "workflow_dispatch" ]; then
            V="${{ inputs.version }}"
            V="${V#v}"
          else
            REF="${GITHUB_REF_NAME}"
            if [[ "$REF" =~ ^(.+)-v([0-9]+\.[0-9]+\.[0-9]+)$ ]]; then
              TAG_SLUG="${BASH_REMATCH[1]}"
              V="${BASH_REMATCH[2]}"
              if [ "$TAG_SLUG" != "$SLUG" ]; then
                echo "tag $REF is for $TAG_SLUG, this tree is $CHANNEL ($SLUG)" >&2
                exit 1
              fi
            elif [[ "$REF" =~ ^v([0-9]+\.[0-9]+\.[0-9]+)$ ]]; then
              V="${BASH_REMATCH[1]}"
              if [ "$CHANNEL" != "main" ]; then
                echo "plain v* tags are only for main; this tree is $CHANNEL" >&2
                exit 1
              fi
            else
              echo "bad tag: $REF" >&2
              exit 1
            fi
          fi
          if [[ ! "$V" =~ ^[0-9]+\.[0-9]+\.[0-9]+$ ]]; then
            echo "bad version: $V" >&2
            exit 1
          fi
          echo "channel=$CHANNEL" >> "$GITHUB_OUTPUT"
          echo "slug=$SLUG" >> "$GITHUB_OUTPUT"
          echo "version=$V" >> "$GITHUB_OUTPUT"
          echo "tag=${SLUG}-v${V}" >> "$GITHUB_OUTPUT"
          echo "bin=FoloToy-AI-Passport-${SLUG}.bin" >> "$GITHUB_OUTPUT"
          echo "factory=FoloToy-AI-Passport-${SLUG}-factory.bin" >> "$GITHUB_OUTPUT"

      - name: Build
        uses: espressif/esp-idf-ci-action@v1
        with:
          esp_idf_version: v5.5.3
          target: esp32c3
          command: >
            idf.py -D PROJECT_VER=${{ steps.ver.outputs.version }}
            -D APP_OTA_CHANNEL=${{ steps.ver.outputs.channel }} build
            && python -m esptool --chip esp32c3 merge_bin
            -o build/FoloToy-AI-Passport-factory.bin
            --flash_mode dio --flash_freq 80m --flash_size 8MB
            0x0 build/bootloader/bootloader.bin
            0x8000 build/partition_table/partition-table.bin
            0xf000 build/ota_data_initial.bin
            0x20000 build/FoloToy-AI-Passport.bin

      - name: Hash images
        id: man
        run: |
          set -euo pipefail
          APP=build/FoloToy-AI-Passport.bin
          FAC=build/FoloToy-AI-Passport-factory.bin
          test -f "$APP"
          test -f "$FAC"
          DIST="${RUNNER_TEMP}/fw"
          mkdir -p "$DIST"
          APP_SHA=$(sha256sum "$APP" | awk '{print $1}')
          APP_SIZE=$(stat -c%s "$APP")
          FAC_SHA=$(sha256sum "$FAC" | awk '{print $1}')
          FAC_SIZE=$(stat -c%s "$FAC")
          echo "sha=$APP_SHA" >> "$GITHUB_OUTPUT"
          echo "size=$APP_SIZE" >> "$GITHUB_OUTPUT"
          echo "factory_sha=$FAC_SHA" >> "$GITHUB_OUTPUT"
          echo "factory_size=$FAC_SIZE" >> "$GITHUB_OUTPUT"
          echo "dist=$DIST" >> "$GITHUB_OUTPUT"
          cp "$APP" "$DIST/${{ steps.ver.outputs.bin }}"
          cp "$FAC" "$DIST/${{ steps.ver.outputs.factory }}"

      - name: Write latest.json
        env:
          CHANNEL: ${{ steps.ver.outputs.channel }}
          VERSION: ${{ steps.ver.outputs.version }}
          TAG: ${{ steps.ver.outputs.tag }}
          BIN: ${{ steps.ver.outputs.bin }}
          FACTORY: ${{ steps.ver.outputs.factory }}
          SHA: ${{ steps.man.outputs.sha }}
          SIZE: ${{ steps.man.outputs.size }}
          FACTORY_SHA: ${{ steps.man.outputs.factory_sha }}
          FACTORY_SIZE: ${{ steps.man.outputs.factory_size }}
          DIST: ${{ steps.man.outputs.dist }}
        run: |
          BASE="https://github.com/${GITHUB_REPOSITORY}/releases/download/${TAG}"
          URL="${BASE}/${BIN}"
          FACTORY_URL="${BASE}/${FACTORY}"
          printf '%s\n' \
            '{' \
            "  \"channel\": \"${CHANNEL}\"," \
            "  \"version\": \"${VERSION}\"," \
            "  \"url\": \"${URL}\"," \
            "  \"sha256\": \"${SHA}\"," \
            "  \"size\": ${SIZE}," \
            "  \"factory_url\": \"${FACTORY_URL}\"," \
            "  \"factory_sha256\": \"${FACTORY_SHA}\"," \
            "  \"factory_size\": ${FACTORY_SIZE}" \
            '}' > "${DIST}/latest.json"
          cat "${DIST}/latest.json"

      - name: GitHub Release
        uses: softprops/action-gh-release@v2
        with:
          tag_name: ${{ steps.ver.outputs.tag }}
          name: ${{ steps.ver.outputs.channel }} ${{ steps.ver.outputs.version }}
          generate_release_notes: true
          files: |
            ${{ steps.man.outputs.dist }}/${{ steps.ver.outputs.bin }}
            ${{ steps.man.outputs.dist }}/${{ steps.ver.outputs.factory }}
            ${{ steps.man.outputs.dist }}/latest.json

      - name: Point this channel on default branch
        env:
          CHANNEL: ${{ steps.ver.outputs.channel }}
          VERSION: ${{ steps.ver.outputs.version }}
          TAG: ${{ steps.ver.outputs.tag }}
          BIN: ${{ steps.ver.outputs.bin }}
          FACTORY: ${{ steps.ver.outputs.factory }}
          SHA: ${{ steps.man.outputs.sha }}
          SIZE: ${{ steps.man.outputs.size }}
          FACTORY_SHA: ${{ steps.man.outputs.factory_sha }}
          FACTORY_SIZE: ${{ steps.man.outputs.factory_size }}
          DIST: ${{ steps.man.outputs.dist }}
        run: |
          set -euo pipefail
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          BRANCH="${{ github.event.repository.default_branch }}"
          git reset --hard HEAD
          git clean -fd
          git fetch origin "$BRANCH"
          git checkout -B "$BRANCH" "origin/$BRANCH"
          mkdir -p "ota/${CHANNEL}"
          cp "${DIST}/latest.json" "ota/${CHANNEL}/latest.json"
          git add "ota/${CHANNEL}/latest.json"
          if git diff --staged --quiet; then
            echo "latest.json already current"
            exit 0
          fi
          git commit -m "chore(ota): point ${CHANNEL} at ${TAG}"
          git push origin "$BRANCH"
